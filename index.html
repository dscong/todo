<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo 清单</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }
  .app {
    width: 480px;
    max-width: 95vw;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    color: #1a1a2e;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: #4f8cff; }
  .input-row button {
    padding: 12px 20px;
    background: #4f8cff;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s;
  }
  .input-row button:hover { background: #3a6fd8; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: #888;
  }
  .filters {
    display: flex;
    gap: 6px;
  }
  .filters button {
    padding: 5px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  .filters button.active {
    background: #4f8cff;
    color: #fff;
    border-color: #4f8cff;
  }
  .clear-btn {
    background: none;
    border: none;
    color: #e06060;
    cursor: pointer;
    font-size: 13px;
  }
  .clear-btn:hover { text-decoration: underline; }
  .todo-list {
    list-style: none;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    overflow: hidden;
  }
  .todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0;
    transition: background .15s;
  }
  .todo-list li:last-child { border-bottom: none; }
  .todo-list li:hover { background: #fafbfc; }
  .todo-list li.completed .text { text-decoration: line-through; color: #bbb; }
  .todo-list li input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #4f8cff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-list li .text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  .todo-list li .edit-input {
    flex: 1;
    font-size: 15px;
    padding: 4px 8px;
    border: 2px solid #4f8cff;
    border-radius: 6px;
    outline: none;
  }
  .todo-list li .del-btn {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 0 4px;
    flex-shrink: 0;
    transition: color .15s;
    visibility: hidden;
  }
  .todo-list li:hover .del-btn { visibility: visible; }
  .todo-list li .del-btn:hover { color: #e06060; }
  .empty {
    text-align: center;
    padding: 40px;
    color: #bbb;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Todo 清单</h1>
  <div class="input-row">
    <input id="newTodo" type="text" placeholder="添加新任务..." autofocus>
    <button id="addBtn">添加</button>
  </div>
  <div class="toolbar">
    <span id="counter">0 项任务</span>
    <div class="filters">
      <button class="active" data-filter="all">全部</button>
      <button data-filter="active">进行中</button>
      <button data-filter="completed">已完成</button>
    </div>
    <button class="clear-btn" id="clearCompleted">清除已完成</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
</div>

<script>
  const STORAGE_KEY = 'todo_app_data';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  const newTodo = document.getElementById('newTodo');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  const counter = document.getElementById('counter');
  const clearBtn = document.getElementById('clearCompleted');

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

  function addTodo() {
    const text = newTodo.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, completed: false });
    newTodo.value = '';
    save();
    render();
  }

  function removeTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) { todo.completed = !todo.completed; save(); render(); }
  }

  function updateTodo(id, text) {
    const todo = todos.find(t => t.id === id);
    if (todo && text.trim()) { todo.text = text.trim(); save(); render(); }
    else if (!text.trim()) render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.completed);
    save();
    render();
  }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filters button').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === f);
    });
    render();
  }

  function render() {
    const filtered = todos.filter(t => {
      if (filter === 'active') return !t.completed;
      if (filter === 'completed') return t.completed;
      return true;
    });

    const activeCount = todos.filter(t => !t.completed).length;
    counter.textContent = `${activeCount} 项任务`;

    if (filtered.length === 0) {
      todoList.innerHTML = `<li class="empty">${todos.length ? '暂无匹配任务' : '暂无任务，开始添加吧'}</li>`;
      return;
    }

    todoList.innerHTML = filtered.map(t => `
      <li class="${t.completed ? 'completed' : ''}">
        <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle" data-id="${t.id}">
        <span class="text">${escapeHtml(t.text)}</span>
        <button class="del-btn" data-action="delete" data-id="${t.id}">&times;</button>
      </li>
    `).join('');
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // Event listeners
  addBtn.addEventListener('click', addTodo);
  newTodo.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  todoList.addEventListener('click', e => {
    const action = e.target.dataset.action;
    const id = Number(e.target.dataset.id);
    if (action === 'toggle') toggleTodo(id);
    if (action === 'delete') removeTodo(id);
  });

  // Double-click to edit
  todoList.addEventListener('dblclick', e => {
    const li = e.target.closest('li');
    if (!li || li.querySelector('.edit-input')) return;
    const span = li.querySelector('.text');
    if (!span) return;
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = span.textContent;
    span.replaceWith(input);
    input.focus();
    input.select();

    const finish = () => {
      const id = Number(li.querySelector('[data-id]')?.dataset.id);
      updateTodo(id, input.value.trim() || span.textContent);
    };
    input.addEventListener('blur', finish);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(); });
  });

  clearBtn.addEventListener('click', clearCompleted);

  document.querySelector('.filters').addEventListener('click', e => {
    if (e.target.dataset.filter) setFilter(e.target.dataset.filter);
  });

  render();
</script>
</body>
</html>
