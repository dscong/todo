<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每周30分钟 · 精读好书</title>
<style>
  :root {
    --bg: #f5f0eb;
    --card: #fff;
    --primary: #7c3aed;
    --primary-dark: #6d28d9;
    --primary-light: #ede9fe;
    --accent: #059669;
    --accent-light: #d1fae5;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e0d8;
    --shadow: 0 4px 20px rgba(0,0,0,.07);
    --r: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 15px;
  }

  /* header */
  .header {
    background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
    color: #fff;
    text-align: center;
    padding: 48px 20px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(124,58,237,.3);
  }
  .header h1 { font-size: clamp(22px,4vw,30px); font-weight: 800; margin-bottom: 6px; letter-spacing: -.3px; }
  .header p { font-size: 13px; opacity: .85; max-width: 440px; margin: 0 auto 20px; }
  .hstats {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hstats div {
    background: rgba(255,255,255,.18);
    padding: 8px 18px;
    border-radius: 10px;
    text-align: center;
    min-width: 80px;
  }
  .hstats .n { font-size: 24px; font-weight: 800; }
  .hstats .l { font-size: 11px; opacity: .7; }
  .prog-wrap {
    max-width: 400px;
    margin: 14px auto 0;
    background: rgba(255,255,255,.25);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: #fff;
    border-radius: 10px;
    transition: width .6s ease;
    width: 0%;
  }
  .reset-btn {
    position: absolute;
    top: 12px;
    right: 14px;
    background: rgba(255,255,255,.15);
    border: none;
    color: rgba(255,255,255,.7);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .reset-btn:hover { background: rgba(255,255,255,.3); color: #fff; }

  .container { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }

  /* book card */
  .book-week {
    background: var(--card);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 14px;
    overflow: hidden;
    transition: box-shadow .2s;
  }
  .book-week:hover { box-shadow: 0 6px 32px rgba(0,0,0,.1); }
  .book-week.done { border-color: #a7f3d0; }

  .week-hd {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .week-hd:hover { background: #faf8f5; }
  .book-week.open .week-hd { background: var(--primary-light); }
  .week-num {
    font-size: 11px;
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    padding: 3px 10px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .book-week.done .week-num { background: var(--accent); }
  .book-meta { flex: 1; }
  .book-meta .title { font-size: 15px; font-weight: 700; }
  .book-meta .author { font-size: 12px; color: var(--muted); }
  .book-week.done .book-meta .title { text-decoration: line-through; color: var(--muted); }
  .done-badge {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    display: none;
  }
  .book-week.done .done-badge { display: block; }
  .week-arrow {
    font-size: 16px;
    color: var(--muted);
    transition: transform .2s;
    flex-shrink: 0;
  }
  .book-week.open .week-arrow { transform: rotate(180deg); }

  .week-body { display: none; padding: 4px 18px 18px; }
  .book-week.open .week-body { display: block; }

  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .tag {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 5px;
    background: var(--primary-light);
    color: var(--primary-dark);
  }
  .tag.p { background: #fef3c7; color: #92400e; }
  .tag.a { background: #fce7f3; color: #9d174d; }
  .tag.t { background: var(--accent-light); color: #065f46; }

  /* reading plan */
  .plan {
    background: #faf8f5;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .plan-hd { font-size: 13px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .plan ol {
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .plan ol li { font-size: 13px; color: var(--muted); }
  .plan ol li strong { color: var(--text); font-size: 14px; }

  /* key insights */
  .insights { margin-bottom: 14px; }
  .insights-hd { font-size: 13px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; }
  .insights ul {
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .insights ul li { font-size: 13px; color: var(--muted); padding-left: 4px; }
  .insights ul li strong { color: var(--text); }

  /* quote */
  .quote {
    border-left: 3px solid var(--primary);
    padding: 10px 14px;
    background: var(--primary-light);
    border-radius: 0 8px 8px 0;
    margin-bottom: 14px;
    font-style: italic;
    font-size: 14px;
    color: var(--primary-dark);
  }
  .quote cite { font-size: 12px; font-style: normal; display: block; margin-top: 4px; color: var(--muted); }

  /* reflection */
  .reflect {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .reflect-hd { font-size: 13px; font-weight: 700; color: #92400e; margin-bottom: 8px; }
  .reflect p { font-size: 13px; color: #78350f; margin-bottom: 8px; }
  .reflect textarea {
    width: 100%;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
    outline: none;
    background: #fff;
    color: var(--text);
  }
  .reflect textarea:focus { border-color: var(--primary); }

  /* complete btn */
  .comp-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    transition: background .15s;
  }
  .comp-btn:hover { background: var(--primary-dark); }
  .book-week.done .comp-btn { background: var(--accent); cursor: default; }
  .book-week.done .comp-btn::after { content: ' ✓ 已完成'; }

  /* intro section */
  .intro {
    background: var(--card);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 20px 22px;
    margin-bottom: 24px;
  }
  .intro h2 { font-size: 17px; margin-bottom: 8px; }
  .intro p { font-size: 13px; color: var(--muted); }
  .intro p strong { color: var(--text); }

  footer { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 12px; }

  @media (max-width: 600px) {
    .header { padding: 32px 14px 24px; }
    .hstats { gap: 10px; }
    .container { padding: 14px 10px 50px; }
    .week-hd, .week-body { padding-left: 14px; padding-right: 14px; }
    .plan, .reflect, .quote { margin-left: 0; margin-right: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="reset-btn" onclick="if(confirm('重置所有阅读进度？')){localStorage.removeItem('book-club');location.reload()}">重置</button>
  <h1>📚 每周30分钟 · 精读好书</h1>

  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog-bar"></div></div>
</div>

<div class="container" id="app"></div>

<footer>每周30分钟精读 · 2026 · 用思想塑造更好的自己</footer>

let state = {};

function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch { state = {}; }
}

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function toggle(id) {
  const card = document.getElementById('week-' + id);
  if (state[id]?.done) {
    card.classList.toggle('open');
  } else {
    state[id] = { done: false, notes: '', opened: true };
    save();
    card.classList.add('open');
    render();
  }
}

function markDone(week) {
  if (state[week]?.done) return;
  state[week] = { ...(state[week] || {}), done: true };
  save();
  render();
}

function updateNotes(week, val) {
  if (!state[week]) state[week] = { done: false, notes: '' };
  state[week].notes = val;
  save();
}

function render() {
  const doneCount = Object.values(state).filter(v => v.done).length;
  document.getElementById('done-count').textContent = doneCount;
  document.getElementById('pct').textContent = Math.round(doneCount / TOTAL * 100) + '%';
  document.getElementById('prog-bar').style.width = (doneCount / TOTAL * 100) + '%';

  document.getElementById('app').innerHTML = books.map(b => {
    const s = state[b.week] || {};
    const isOpen = s.opened || false;
    const isDone = s.done || false;
    const tagClass = b.tagClass ? b.tagClass : '';

    return `
    <div class="book-week${isDone ? ' done' : ''}${isOpen ? ' open' : ''}" id="week-${b.week}">
      <div class="week-hd" onclick="toggle(${b.week})">
        <span class="week-num">第${b.week}周</span>
        <div class="book-meta">
          <div class="title">《${b.title}》<span style="font-size:12px;font-weight:400;color:#999"> ${b.author}</span></div>
          <div class="author">${b.time}</div>
        </div>
        <span class="done-badge">已完成</span>
        <span class="week-arrow">▼</span>
      </div>
      <div class="week-body">
        <div class="tag-row">
          ${b.tags.map((t, i) => `<span class="tag${i === 0 && b.tagClass ? ' '+b.tagClass : ''}">${t}</span>`).join('')}
        </div>

        <div class="quote">"${b.quote.substring(1, b.quote.length-1)}"<cite>${b.cite}</cite></div>

        <div class="plan">
          <div class="plan-hd">⏱ 30分钟阅读计划</div>
          <ol>
            ${b.plan.map(p => `<li><strong>[${p.min}]</strong> ${p.tip}</li>`).join('')}
          </ol>
        </div>

        <div class="insights">
          <div class="insights-hd">💡 核心洞察</div>
          <ul>
            ${b.insights.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>

        <div class="reflect">
          <div class="reflect-hd">🤔 思考题（30秒写下答案）</div>
          <p>${b.reflection}</p>
          <textarea placeholder="写下你的思考..." onchange="updateNotes(${b.week}, this.value)" oninput="this.style.height=this.scrollHeight+'px'">${s.notes || ''}</textarea>
        </div>

        <button class="comp-btn" onclick="markDone(${b.week})">${isDone ? '' : '✅ 标记为已完成'}</button>
      </div>
    </div>`;
  }).join('');
}

load();
render();
</script>
