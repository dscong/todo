<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每周30分钟 · 精读好书</title>
<style>
  :root {
    --bg: #f5f0eb;
    --card: #fff;
    --primary: #7c3aed;
    --primary-dark: #6d28d9;
    --primary-light: #ede9fe;
    --accent: #059669;
    --accent-light: #d1fae5;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e0d8;
    --shadow: 0 4px 20px rgba(0,0,0,.07);
    --r: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
  }

  .header {
    background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
    color: #fff;
    text-align: center;
    padding: 44px 20px 36px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(124,58,237,.3);
  }
  .header h1 { font-size: clamp(20px,4vw,28px); font-weight: 800; margin-bottom: 6px; }
  .header p { font-size: 13px; opacity: .85; max-width: 480px; margin: 0 auto 16px; }
  .hstats {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hstats div { background: rgba(255,255,255,.18); padding: 8px 16px; border-radius: 10px; text-align: center; min-width: 72px; }
  .hstats .n { font-size: 22px; font-weight: 800; }
  .hstats .l { font-size: 11px; opacity: .7; }
  .prog-wrap { max-width: 380px; margin: 12px auto 0; background: rgba(255,255,255,.25); border-radius: 10px; height: 7px; overflow: hidden; }
  .prog-fill { height: 100%; background: #fff; border-radius: 10px; transition: width .6s ease; width: 0%; }
  .reset-btn { position: absolute; top: 12px; right: 14px; background: rgba(255,255,255,.15); border: none; color: rgba(255,255,255,.7); font-size: 11px; cursor: pointer; padding: 4px 10px; border-radius: 6px; }

  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  .book-card {
    background: var(--card);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 16px;
    overflow: hidden;
    transition: box-shadow .2s;
  }
  .book-card:hover { box-shadow: 0 6px 28px rgba(0,0,0,.1); }
  .book-card.done { border-color: #a7f3d0; }

  .book-hd {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .book-hd:hover { background: #faf8f5; }
  .book-card.open .book-hd { background: var(--primary-light); }
  .wnum { font-size: 11px; font-weight: 700; background: var(--primary); color: #fff; padding: 3px 9px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
  .book-card.done .wnum { background: var(--accent); }
  .book-info { flex: 1; }
  .book-info .title { font-size: 15px; font-weight: 700; }
  .book-info .author { font-size: 12px; color: var(--muted); }
  .done-check { color: var(--accent); font-size: 13px; display: none; margin-right: 4px; }
  .book-card.done .done-check { display: inline; }
  .book-card.done .book-info .title { text-decoration: line-through; color: var(--muted); }
  .arr { font-size: 16px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
  .book-card.open .arr { transform: rotate(180deg); }

  .book-bd { display: none; padding: 0 16px 18px; }
  .book-card.open .book-bd { display: block; }

  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 5px; background: var(--primary-light); color: var(--primary-dark); }

  /* content sections */
  .sec-hd { font-size: 13px; font-weight: 700; color: var(--primary-dark); margin: 14px 0 8px; display: flex; align-items: center; gap: 5px; }
  .core { background: var(--primary-light); border-radius: 10px; padding: 14px 16px; margin: 10px 0; border-left: 3px solid var(--primary); }
  .core p { font-size: 14px; color: var(--primary-dark); }
  .core strong { font-size: 15px; }

  .insight-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f1f0ee;
    align-items: flex-start;
  }
  .insight-item:last-child { border-bottom: none; }
  .insight-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
  .insight-text { font-size: 13px; color: #4b5563; }
  .insight-text strong { color: var(--text); display: block; font-size: 14px; margin-bottom: 2px; }

  .quote-box {
    border-left: 3px solid var(--primary);
    background: linear-gradient(to right, var(--primary-light), #fff);
    padding: 12px 16px;
    border-radius: 0 10px 10px 0;
    margin: 12px 0;
    font-style: italic;
    font-size: 14px;
    color: var(--primary-dark);
  }
  .quote-box cite { font-size: 12px; font-style: normal; display: block; margin-top: 4px; color: var(--muted); }

  .action-card {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 10px 0;
  }
  .action-card .action-hd { font-size: 12px; font-weight: 700; color: #166534; margin-bottom: 6px; }
  .action-list { list-style: none; }
  .action-list li { font-size: 13px; color: #15803d; padding: 3px 0; display: flex; gap: 6px; align-items: flex-start; }
  .action-list li::before { content: '✓'; flex-shrink: 0; }

  .think { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .think-hd { font-size: 12px; font-weight: 700; color: #92400e; margin-bottom: 6px; }
  .think textarea {
    width: 100%; border: 1px solid #fde68a; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
    resize: vertical; min-height: 60px; outline: none; background: #fff; color: var(--text);
  }
  .think textarea:focus { border-color: var(--primary); }

  .mark-btn {
    width: 100%; padding: 11px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--primary); color: #fff; transition: background .15s; margin-top: 10px;
  }
  .mark-btn:hover { background: var(--primary-dark); }
  .book-card.done .mark-btn { background: var(--accent); cursor: default; }

  footer { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 12px; }

  @media (max-width: 600px) {
    .header { padding: 30px 14px 22px; }
    .hstats { gap: 8px; }
    .container { padding: 14px 10px 50px; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="reset-btn" onclick="if(confirm('重置所有进度？')){localStorage.removeItem('book2');location.reload()}">重置</button>
  <h1>📚 每周30分钟 · 精读好书</h1>

</div>

<div class="container" id="app"></div>

<footer>每周30分钟精读 · 2026</footer>

function load() { try { S = JSON.parse(localStorage.getItem(K)) || {}; } catch { S = {}; } }
function save() { localStorage.setItem(K, JSON.stringify(S)); }

function toggle(w) {
  const c = document.getElementById('b' + w);
  if (!S[w]) S[w] = { done: false, notes: '', open: false };
  S[w].open = !S[w].open;
  save(); render();
}

function markDone(w) {
  if (S[w]) S[w].done = true;
  else S[w] = { done: true, notes: '', open: true };
  save(); render();
}

function updateNotes(w, v) {
  if (!S[w]) S[w] = { done: false, notes: '' };
  S[w].notes = v; save();
}

function render() {
  const done = Object.values(S).filter(v => v.done).length;
  document.getElementById('done').textContent = done;
  document.getElementById('pct').textContent = Math.round(done/TOTAL*100)+'%';
  document.getElementById('bar').style.width = done/TOTAL*100+'%';

  document.getElementById('app').innerHTML = books.map(b => {
    const s = S[b.week] || {};
    const open = s.open || false;
    const done = s.done || false;
    return `<div class="book-card${done?' done':''}${open?' open':''}" id="b${b.week}">
      <div class="book-hd" onclick="toggle(${b.week})">
        <span class="wnum">第${b.week}周</span>
        <div class="book-info">
          <div class="title"><span class="done-check">✓</span>《${b.title}》<span style="font-size:12px;font-weight:400;color:#999"> ${b.author}</span></div>
          <div class="author">${b.time}</div>
        </div>
        <span class="arr">▼</span>
      </div>
      <div class="book-bd">
        <div class="tags">${b.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <p style="font-size:13px;color:var(--muted);line-height:1.7">${b.summary}</p>
        <div class="core"><strong>一句话核心：</strong><p>${b.core}</p></div>
        <div class="quote-box">"${b.quote.substring(1,b.quote.length-1)}"<cite>${b.cite}</cite></div>
        <div class="sec-hd">💡 核心洞察</div>
        ${b.insights.map(i => `<div class="insight-item"><span class="insight-icon">${i.icon}</span><div class="insight-text"><strong>${i.title}</strong>${i.text}</div></div>`).join('')}
        <div class="action-card"><div class="action-hd">🚀 立刻行动（3选1开始）</div><ul class="action-list">${b.actions.map(a => `<li>${a}</li>`).join('')}</ul></div>
        <div class="think"><div class="think-hd">🤔 思考题</div><p style="font-size:13px;color:#78350f;margin-bottom:6px">${b.think}</p><textarea placeholder="写下你的思考..." oninput="this.style.height=this.scrollHeight+'px'" onchange="updateNotes(${b.week},this.value)">${s.notes||''}</textarea></div>
        <button class="mark-btn" onclick="markDone(${b.week})">${done?'':'✅ 标记为已完成'}</button>
      </div>
    </div>`;
  }).join('');
}

load(); render();
